<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Linux Security Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
            margin: 0;
        }

        /* =========================
           SIDEBAR
        ========================= */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1e293b;
            color: white;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar h3 {
            padding: 20px;
            margin: 0;
            text-align: center;
            border-bottom: 1px solid #334155;
            font-size: 20px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 25px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
            border-left: 3px solid transparent;
        }

        .sidebar a:hover {
            background: #334155;
            border-left-color: #60a5fa;
        }

        .sidebar a.active {
            background: #475569;
            border-left-color: #3b82f6;
        }

        .sidebar a i {
            width: 20px;
            text-align: center;
        }

        /* Divider */
        .sidebar-divider {
            height: 1px;
            background: #334155;
            margin: 10px 20px;
        }

        .sidebar-label {
            padding: 10px 25px 5px 25px;
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        /* =========================
           CONTENT
        ========================= */
        .content {
            margin-left: 240px;
            padding: 25px;
            min-height: 100vh;
        }

        /* =========================
           CARD
        ========================= */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }

            .sidebar h3 {
                font-size: 0;
                padding: 20px 5px;
            }

            .sidebar h3::after {
                content: "LS";
                font-size: 18px;
            }

            .sidebar a {
                justify-content: center;
                padding: 15px 5px;
            }

            .sidebar a span {
                display: none;
            }

            .sidebar-label {
                display: none;
            }

            .sidebar-divider {
                margin: 5px 10px;
            }

            .content {
                margin-left: 70px;
                padding: 15px;
            }
        }
    </style>

</head>

<body>

<!-- =====================================================
     SIDEBAR
===================================================== -->
<div class="sidebar">

    <h3>🛡️ SecMon</h3>

    <!-- =========================
         MAIN MENU
    ========================= -->
    <div class="sidebar-label">Main Menu</div>

    <!-- Dashboard -->
    <a href="/dashboard">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
    </a>

    <!-- Monitoring Log -->
    <a href="/monitoring">
        <i class="fa-solid fa-server"></i>
        <span>Monitoring Log</span>
    </a>

    <!-- Firewall -->
    <a href="/firewall">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Firewall</span>
    </a>

    <!-- Fail2Ban -->
    <a href="/fail2ban">
        <i class="fa-solid fa-ban"></i>
        <span>Fail2Ban</span>
    </a>

    <!-- Security Events -->
    <a href="/security-events">
        <i class="fa-solid fa-file-shield"></i>
        <span>Security Events</span>
    </a>

    <!-- =========================
         SECURITY TOOLS
    ========================= -->
    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Security Tools</div>

    <!-- DoS Detection -->
    <a href="/dos">
        <i class="fa-solid fa-bolt"></i>
        <span>DoS Detection</span>
    </a>

    <!-- ARP Spoofing / MITM (BARU!) -->
    <a href="/arp">
        <i class="fa-solid fa-arrows-spin"></i>
        <span>ARP / MITM</span>
    </a>

    <!-- Nmap Scanning Detection -->
    <a href="/nmap">
        <i class="fa-solid fa-magnifying-glass-chart"></i>
       <span>Nmap Detection</span>
    </a>

    <!-- Audit -->
    <a href="/audit">
        <i class="fa-solid fa-clipboard-check"></i>
        <span>ISO Audit</span>
    </a>

    <!-- =========================
         DATA & FEEDBACK
    ========================= -->
    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Data & Feedback</div>

    <!-- Data Management -->
    <a href="/data-management">
        <i class="fa-solid fa-database"></i>
        <span>Data Management</span>
    </a>

    <!-- Feedback -->
    <a href="/feedback">
        <i class="fa-solid fa-comment"></i>
        <span>Feedback</span>
    </a>

    <!-- =========================
         USER
    ========================= -->
    <div class="sidebar-divider"></div>
    <div class="sidebar-label">User</div>

    <!-- Logout -->
    <a href="/logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
    </a>

</div>

<!-- =====================================================
     MAIN CONTENT
===================================================== -->
<div class="content">

    {% block content %}
    {% endblock %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
